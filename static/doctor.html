<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>108 ER Doctor Triage Dashboard</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #090d16; color: #e2e8f0; padding: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 16px; }
    .card { background: #1e293b; padding: 18px; border-radius: 14px; }
    .badge { padding: 4px 10px; border-radius: 8px; font-weight: 800; background: #dc2626; color: #fff; }
    input { width: 72%; padding: 10px; border-radius: 8px; border: none; }
    button { padding: 10px 14px; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-weight: bold; cursor: pointer; }
    img { max-width: 100%; border-radius: 10px; margin-top: 10px; max-height: 240px; object-fit: cover; }
  </style>
</head>
<body>
  <h2>🩺 108 Hospital Trauma & Triage Command</h2>
  <button onclick="fetchSessions()">🔄 Refresh Cases</button>
  <div id="cases-container" class="grid"></div>

  <script>
    async function fetchSessions() {
      const res = await fetch('/api/sessions');
      const sessions = await res.json();
      const container = document.getElementById('cases-container');
      container.innerHTML = "";

      sessions.forEach(s => {
        const triageHtml = s.triage
          ? `<p><span class="badge">${s.triage.severity}</span> <strong>${s.triage.injury_type}</strong></p>
             <p><strong>Signs:</strong> ${s.triage.visible_symptoms.join(", ")}</p>
             <p><strong>ER Prep:</strong> ${s.triage.recommended_doctor_prep}</p>`
          : `<p style="color:#94a3b8;">No injury photo uploaded yet.</p>`;

        const imgHtml = s.image_url ? `<img src="${s.image_url}" alt="Injury" />` : "";
        const chatHtml = s.chat_history.map(m => `<div><strong>${m.role}:</strong> ${m.content}</div>`).join("");

        container.innerHTML += `
          <div class="card">
            <h3>🚨 ${s.session_id} • Status: ${s.status}</h3>
            <p>📍 GPS: ${s.bystander.lat.toFixed(4)}, ${s.bystander.lon.toFixed(4)}</p>
            ${triageHtml}
            ${imgHtml}
            <hr style="border-color:#334155; margin:12px 0;" />
            <h4>🎙️ Live Voice Transcript</h4>
            <div style="max-height:140px; overflow-y:auto; font-size:14px;">${chatHtml || "Waiting for bystander audio..."}</div>
            <div style="margin-top:12px;">
              <input id="ov-${s.session_id}" placeholder="Send direct instruction to AI voice bot..." value="${s.doctor_override || ''}" />
              <button onclick="sendOverride('${s.session_id}')">Override</button>
            </div>
          </div>`;
      });
    }

    async function sendOverride(sessionId) {
      const text = document.getElementById(`ov-${sessionId}`).value;
      await fetch(`/api/doctor/override/${sessionId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ instruction: text })
      });
      alert("Doctor instruction injected into live AI dispatcher!");
    }

    fetchSessions();
    setInterval(fetchSessions, 5000);
  </script>
</body>
</html>
